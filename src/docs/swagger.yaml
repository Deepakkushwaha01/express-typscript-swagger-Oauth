openapi: 3.0.0
info:
  title: Flat Sharing App API
  description: API for user registration and authentication
  version: 1.0.0

servers:
  - url: https://localhost:8000
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []

paths:
  /signup:
    post:
      summary: Register a new user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - phoneNumber
                - gender
                - dateOfBirth
                - password
                - verificationID
                - currentAddress
                - userType
              properties:
                fullName:
                  type: string
                  description: User's full name
                email:
                  type: string
                  format: email
                  description: User's email address
                phoneNumber:
                  type: string
                  description: User's phone number
                gender:
                  type: string
                  enum: [Male, Female, Other]
                  description: User's gender
                dateOfBirth:
                  type: string
                  format: date
                  description: User's date of birth
                password:
                  type: string
                  format: password
                  description: User's password
                verificationID:
                  type: object
                  description: User's verification ID details
                  properties:
                    idType:
                      type: string
                      enum: [Passport, DriverLicense, NationalID]
                      description: Type of ID document
                    documentNumber:
                      type: string
                      description: ID document number
                currentAddress:
                  type: string
                  description: User's current address
                userType:
                  type: string
                  enum: [Tenant, Owner]
                  description: User type
                profilePicture:
                  type: string
                  description: URL to user's profile picture
                avatarOptions:
                  type: array
                  items:
                    type: string
                  description: List of avatar options
                profession:
                  type: string
                  description: User's profession
                socialPreferences:
                  type: object
                  description: User's social preferences
                  properties:
                    smoking:
                      type: boolean
                      default: false
                      description: Whether the user smokes
                    vegetarian:
                      type: boolean
                      default: false
                      description: Whether the user is vegetarian
                    pets:
                      type: boolean
                      default: false
                      description: Whether the user has pets
                bio:
                  type: string
                  maxLength: 500
                  description: User's bio
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      fullName:
                        type: string
                  accessToken:
                    type: string
        '400':
          description: Bad request
        '409':
          description: User already exists
